<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA | AI Personal Style & Color Analysis</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              stone: {
                50: '#fafaf9',
                100: '#f5f5f4',
                200: '#e7e5e4',
                800: '#292524',
                900: '#1c1917',
              },
              amber: {
                500: '#f59e0b',
                600: '#d97706',
                700: '#b45309',
              },
              rose: {
                500: '#f43f5e',
                600: '#e11d48',
              }
            },
            fontFamily: {
              serif: ['Cinzel', 'serif'],
              sans: ['Plus Jakarta Sans', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">

    <!-- React 18 & ReactDOM 18 -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-[#FAF8F5] text-stone-900 min-h-screen selection:bg-amber-100 selection:text-amber-900">
    <!-- React Root Mount Container -->
    <div id="root"></div>

    <!-- Application Script (Native JS - Native SVG Icons) -->
    <script src="app.js"></script>
</body>
</html>
